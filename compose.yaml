services:
  ctyun:
    image: ${CTYUN_IMAGE:-ghcr.io/fengzhiqiu/ctyun-auto:latest}
    container_name: ctyun-auto
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    shm_size: "512m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
